spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  cache:
    type: simple

app:
  jwt:
    secret: test-secret-key-change-me-please-1234567890-1234567890
    expiration: 1h

  payment:
    base-url: http://localhost:9999
    timeout: 1s

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - circuitbreakers