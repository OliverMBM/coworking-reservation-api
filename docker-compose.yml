services:
  postgres:
    image: postgres:16-alpine
    container_name: coworking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coworking_reservation
      POSTGRES_USER: coworking
      POSTGRES_PASSWORD: coworking
    ports:
      - "5432:5432"
    volumes:
      - coworking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworking -d coworking_reservation"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  coworking_postgres_data: