services:
  postgres:
    image: postgres:16-alpine
    container_name: coworking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coworking_reservation
      POSTGRES_USER: coworking
      POSTGRES_PASSWORD: coworking
    ports:
      - "5432:5432"
    volumes:
      - coworking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworking -d coworking_reservation"]
      interval: 10s
      timeout: 5s
      retries: 5

  wiremock:
    image: wiremock/wiremock:3.13.1
    container_name: coworking-wiremock
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coworking-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coworking_reservation
      SPRING_DATASOURCE_USERNAME: coworking
      SPRING_DATASOURCE_PASSWORD: coworking
      APP_PAYMENT_BASE_URL: http://wiremock:8080
      APP_PAYMENT_TIMEOUT: 2s
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started

volumes:
  coworking_postgres_data: